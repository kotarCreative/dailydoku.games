<!-- Game Detail Content -->
<main>
@if (game(); as game) {
<article class="mx-auto max-w-2xl p-6">
  <div class="overflow-hidden rounded-lg bg-slate-600 shadow-lg">
    <!-- Game Logo -->
    <div class="flex justify-center bg-slate-700 p-8">
      <img
        [src]="game.logo"
        [alt]="game.name + ' logo'"
        class="h-48 w-48 object-contain"
        width="192"
        height="192"
        fetchpriority="high"
      />
    </div>

    <!-- Game Info -->
    <div class="p-6">
      <h1 class="mb-4 text-3xl font-bold capitalize text-slate-200">
        {{ game.name }}
      </h1>

      <span
        class="mb-4 inline-block rounded-full bg-gray-200 px-3 py-1 text-sm font-semibold text-gray-700"
      >
        {{ typeLabel() }}
      </span>

      <p class="mb-6 text-lg text-slate-300">
        {{ game.description }}
      </p>

      <!-- Actions -->
      <div class="flex flex-wrap items-center gap-4">
        <button
          (click)="onFavouriteGame()"
          class="flex items-center rounded border border-slate-300 px-4 py-2 font-semibold text-slate-300 hover:border-slate-100 hover:text-slate-100"
          [class.bg-slate-300]="isFavourite()"
          [class.text-slate-700]="isFavourite()"
          [class.hover:border-slate-600]="isFavourite()"
          [class.hover:text-slate-600]="isFavourite()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="mr-2 h-5 w-5"
            viewBox="0 0 24 24"
            [attr.fill]="isFavourite() ? 'currentColor' : 'none'"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
            />
          </svg>
          {{ isFavourite() ? 'Favourited' : 'Add to Favourites' }}
        </button>

        <button
          (click)="playGame()"
          class="flex items-center rounded bg-emerald-700 px-6 py-2 font-semibold text-white hover:bg-emerald-600"
        >
          Play Now
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="ml-2 h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</article>
} @else {
<div class="flex min-h-[50vh] items-center justify-center">
  <p class="text-slate-400">Loading game...</p>
</div>
}
</main>
