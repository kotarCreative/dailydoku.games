<div class="walkthrough-container">
  <div class="header">
    <div class="title-section">
      <h2>Play all your favourites</h2>
      <div class="streak-badge" *ngIf="streak() > 0">
        🔥 {{ streak() }} Day Streak
      </div>
    </div>
    <button class="close-btn" (click)="exitWalkthrough()">×</button>
  </div>

  <div class="progress-section">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" [style.width.%]="progress()"></div>
    </div>
    <p class="progress-text">
      <span *ngIf="remainingGamesCount() > 0"
        >{{ remainingGamesCount() }} games left to keep your streak!</span
      >
      <span *ngIf="remainingGamesCount() === 0">🎉 All done for today!</span>
    </p>
  </div>

  <div class="games-grid">
    @for (game of sortedGames(); track game.name) {
      <div
        class="game-wrapper"
        [class.completed]="isCompleted(game.name)"
        (click)="playGame(game)"
      >
        <app-game-card [game]="game"></app-game-card>
        <div class="completed-badge" *ngIf="isCompleted(game.name)">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="3"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4.5 12.75l6 6 9-13.5"
            />
          </svg>
        </div>
      </div>
    } @empty {
      <div class="empty-state">
        <p>
          No favorite games yet! Add some games to your favorites to be able to
          track your daily streaks
        </p>
      </div>
    }
  </div>
</div>
