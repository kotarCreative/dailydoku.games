<app-header #siteHeader />

<div class="dd-workspace">
  <app-daily-banner />
  <main class="dd-main">
    <section class="hero" aria-labelledby="home-heading">
      <div>
        <p class="eyebrow">SMALL GAMES. BIG BRAIN ENERGY.</p>
        <h1 id="home-heading">Your daily dose<br />of “one more”.<span class="sr-only"> Daily puzzles and games.</span></h1>
        <p class="hero-description">Great daily puzzles and games from all over the web.<span class="desktop-only"> Find your next favourite.</span></p>
      </div>
      <div class="play-tiles" aria-hidden="true">
        <span>P</span><span>L</span><span>A</span><span>Y</span>
      </div>
      <span class="play-sticker" aria-hidden="true">LET'S PLAY</span>
    </section>

    <label class="dd-mobile-search">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.7" cy="10.7" r="6.7" /><path d="m16 16 5 5" stroke-linecap="round" /></svg>
      <input type="search" aria-label="Search daily games" aria-controls="games" placeholder="Find your next obsession" [value]="searchTerm()" (input)="onSearchChange($event)" />
    </label>

    <app-game-filters />

    <section id="games" aria-label="Browse daily games">
      <app-game-list />
    </section>

    <footer class="dd-footer">
      <p>A good kind of screen time.</p>
      <nav aria-label="Community">
        <button type="button" (click)="siteHeader.openSuggestDialog()">Know a great game? Tell us</button>
        <a href="https://www.buymeacoffee.com/kotarcreative" target="_blank" rel="noopener noreferrer">Support DailyDoku <app-icon name="external" /></a>
      </nav>
    </footer>
  </main>
</div>
