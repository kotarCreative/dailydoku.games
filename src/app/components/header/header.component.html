<header class="topbar">
    <a class="brand" routerLink="/" aria-label="DailyDoku home"><span class="brand-mark">d.</span><span>dailydoku</span></a>
    <nav class="topnav" aria-label="Main navigation">
        <button type="button" (click)="showDiscover()">Discover</button>
        <button type="button" class="suggest" (click)="openSuggestDialog()">Suggest a game</button>
    </nav>
    <label class="search desktop-search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.7"/><path d="m16 16 5 5"/></svg><input type="search" placeholder="Find your next obsession" aria-label="Search games" [value]="searchTerm()" (input)="onSearchChange($event)"><span class="shortcut" aria-hidden="true">/</span></label>
    <div class="mobile-actions">
        <button type="button" class="icon-button" aria-label="Toggle navigation menu" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu" (click)="menuOpen.set(!menuOpen())"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    @if (menuOpen()) {
      <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation">
        <button type="button" (click)="showDiscover()">Discover all games</button>
        <button type="button" (click)="openSuggestDialog(); menuOpen.set(false)">Suggest a game</button>
        <a href="https://www.buymeacoffee.com/kotarcreative" target="_blank" rel="noopener noreferrer">Support DailyDoku <app-icon name="external" /></a>
      </nav>
    }
</header>
@if (isWalkthroughActive()) {
    <app-daily-walkthrough></app-daily-walkthrough>
}
