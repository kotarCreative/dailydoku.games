<div class="max-w-sm h-full rounded overflow-hidden shadow-lg bg-white flex flex-col" (click)="goto()">
  <img class="w-full object-scale-down p-8 h-48 bg-gray-600" src="{{ game.logo }}" alt="{{ game.name }}">
  <div class="px-6 py-4 flex-1">
    <div class="font-bold text-xl mb-2 capitalize">{{ game.name }}</div>
    <p class="text-gray-700 text-base">
      {{ game.description }}
    </p>
  </div>
  <div class="px-6 pt-4 pb-2">
    <span class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2">{{ game.type }}</span>
   
  </div>
</div>
