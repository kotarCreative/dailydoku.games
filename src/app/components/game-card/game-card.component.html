<article class="game-row">
    <a class="game-link" [routerLink]="['/games', game.slug]" [attr.aria-label]="game.name + ' details'">
        <span class="game-icon"><img [src]="game.logo" alt="" width="40" height="40" loading="lazy" decoding="async" /></span>
        <div class="game-copy">
            <h3 class="game-name">{{ game.name }}</h3>
            <span class="game-description">{{ game.description }}</span>
            <span class="mobile-details">Game details <app-icon name="arrow-right" /></span>
        </div>
    </a>
    <span class="category">{{ typeLabel }}</span>
    <button type="button" class="heart" [attr.aria-label]="(isFavourite ? 'Remove ' : 'Add ') + game.name + (isFavourite ? ' from your favourites' : ' to your favourites')"
        [attr.aria-pressed]="isFavourite" (click)="onFavouriteGame()">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" [attr.fill]="isFavourite ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0l-1 1.1-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" />
        </svg>
    </button>
    <a class="play" [href]="game.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'Play ' + game.name + ' in a new tab'" (click)="trackGameClick()"><span class="play-label">Play</span><app-icon name="external" /></a>
</article>
