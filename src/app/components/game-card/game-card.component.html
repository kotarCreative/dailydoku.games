<section
    class="flex h-full max-w-sm flex-col overflow-hidden rounded-lg bg-slate-600 shadow-lg ring-slate-200 ring-offset-4 ring-offset-slate-700 transition duration-300 ease-in-out hover:cursor-pointer hover:ring"
>
    <img
        class="h-48 w-full bg-transparent object-scale-down p-8"
        src="{{ game.logo }}"
        alt="{{ game.name }}"
        (click)="goto()"
    />
    <div class="mx-auto w-10/12 border border-slate-100 opacity-50"></div>
    <div class="flex-1 px-6 py-4" (click)="goto()">
        <h2 class="mb-2 text-xl font-bold capitalize text-slate-200">
            {{ game.name }}
        </h2>
        <p class="text-base text-slate-300">{{ game.description }}</p>
    </div>
    <div class="align-center flex px-6 pb-6 pt-4">
        <span
            class="inline-block rounded-full bg-gray-200 px-3 py-1 text-sm font-semibold text-gray-700"
            >{{ game.type }}</span
        >
        <a
            [routerLink]="['/games', game.slug]"
            class="ml-2 inline-block rounded-full bg-slate-500 px-3 py-1 text-sm font-semibold text-white hover:bg-slate-400"
        >
            Details
        </a>
        <button
            class="ml-auto text-red-500 hover:animate-pulse hover:text-red-700"
            (click)="onFavouriteGame()"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                [attr.fill]="isFavourite ? 'currentColor' : 'none'"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                />
            </svg>
        </button>
    </div>
</section>
