<section
  class="max-w-sm h-full rounded overflow-hidden shadow-lg bg-white flex flex-col hover:cursor-pointer"
>
  <img
    class="w-full object-scale-down p-8 h-48 bg-gray-600"
    src="{{ game.logo }}"
    alt="{{ game.name }}"
    (click)="goto()"
  />
  <div class="px-6 py-4 flex-1" (click)="goto()">
    <h2 class="font-bold text-xl mb-2 capitalize">{{ game.name }}</h2>
    <p class="text-gray-700 text-base">
      {{ game.description }}
    </p>
  </div>
  <div class="px-2 pt-4 pb-2 flex align-center">
    <span
      class="inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700"
      >{{ game.type }}</span
    >
    <button
      class="text-red-500 hover:text-red-700 ml-auto"
      (click)="onFavouriteGame()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        [attr.fill]="isFavourite ? 'currentColor' : 'none'"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
        />
      </svg>
    </button>
  </div>
</section>
