<div class="relative w-full overflow-hidden bg-slate-800 p-4 shadow-lg sm:p-6">
  <div
    class="relative mx-auto flex max-w-7xl flex-col items-center justify-between gap-4 md:flex-row"
  >
    <!-- Left side: Title and Stats -->
    <div class="flex flex-col items-center gap-2 md:items-start">
      <h2
        class="flex items-center text-xl font-bold text-slate-200 sm:text-2xl"
      >
        {{ hasFavorites() ? "Play all your favourites" : "Build your daily routine" }}
      </h2>

      <div
        class="flex flex-wrap items-center justify-center gap-4 text-sm font-medium text-slate-300 md:justify-start"
      >
        <ng-container *ngIf="hasFavorites(); else noFavoritesStats">
          <div class="flex items-center rounded-full bg-slate-700 px-3 py-1">
            <span class="mr-1">🔥</span>
            Streak: {{ streak() }} day{{ streak() === 1 ? "" : "s" }}
          </div>
        </ng-container>
        <ng-template #noFavoritesStats>
          <div class="flex items-center rounded-full bg-slate-700 px-3 py-1">
            <span class="mr-1">⭐</span>
            Add favorites to create a custom daily walkthrough
          </div>
        </ng-template>
      </div>
    </div>

    <!-- Right side: Action Button -->
    <div>
      <button
        (click)="startDailyWalkthrough()"
        class="group relative inline-flex items-center justify-center overflow-hidden rounded bg-emerald-700 px-6 py-2 font-semibold text-white transition-all hover:bg-emerald-600 hover:text-white focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:ring-offset-slate-800"
      >
        <span class="mr-2">
          {{ !hasFavorites() ? "Browse Games" : isCompleted() ? "Review" : isStarted() ? "Resume" : "Start" }}
        </span>
        <svg
          class="h-5 w-5 transform transition-transform group-hover:translate-x-1"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"
            *ngIf="hasFavorites()"
          ></path>
          <path
             *ngIf="!hasFavorites()"
             stroke-linecap="round"
             stroke-linejoin="round"
             stroke-width="2"
             d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
           ></path>
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            *ngIf="hasFavorites()"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</div>
