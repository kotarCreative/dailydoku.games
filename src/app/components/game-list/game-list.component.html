@if (showEmptyFavouritesMessage) {
<div class="flex flex-col items-center px-6 py-16 text-center">
    <svg aria-hidden="true" focusable="false" class="h-16 w-16 text-red-500"
        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
    </svg>
    <h2 class="mt-6 text-xl font-bold text-slate-200 sm:text-2xl">No favourites yet</h2>
    <p class="mt-2 max-w-md text-base text-slate-300">
        You can add favourites by clicking the heart icon on any game card. They'll show up here and
        become part of your daily routine.
    </p>
</div>
} @else {
<div class="mx-auto grid max-w-7xl gap-4 p-6 sm:grid-cols-2 md:grid-cols-4">
    @for (game of games; track game) {
    <app-game-card [game]="game" [isFavourite]="isFavourite(game)"
        (favouriteGame)="onFavouriteGame(game, $event)" />
    }
</div>
}
