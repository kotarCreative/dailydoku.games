<!DOCTYPE html>
<html lang="en">
  <head>

      name="twitter:description"
      content="Find your new favourite puzzle game. Search for games like wordle, cine2nerdle, pokedoku, and more."

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dailydoku" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
